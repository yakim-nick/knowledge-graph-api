---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  labels:
    app.kubernetes.io/name: knowledge-graph-api
    app.kubernetes.io/component: configmap
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_DB: "knowledge_graph"
  POSTGRES_USER: "kgadmin"
  NEO4J_URI: "bolt://kga-neo4j:7687"
  NEO4J_USER: "neo4j"
  EXTRACTION_MODEL: "gpt-4o"
  EMBEDDING_MODEL: "text-embedding-3-small"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"
  MAX_CONCURRENT_EXTRACTIONS: "5"
  DATABASE_URL: "postgresql+asyncpg://kgadmin:changeme@kga-postgres:5432/knowledge_graph"
