---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: knowledge-graph-api

commonLabels:
  app.kubernetes.io/part-of: knowledge-graph-api
  app.kubernetes.io/managed-by: kustomize

namePrefix: kga-

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - ingress.yaml
  - hpa.yaml
  - pvc.yaml
  - network-policy.yaml
