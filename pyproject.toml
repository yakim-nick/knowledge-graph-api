[project]
name = "knowledge-graph-api"
version = "1.0.0"
description = "Private Knowledge Graph API powered by LLM entity extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "neo4j>=5.20.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "unstructured[pdf,md]>=0.14.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35.0", "pyvis>=0.3.2", "pandas>=2.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0"]
